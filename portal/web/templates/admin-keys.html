{{template "layout" .}}
{{define "content"}}
<div class="page-header">
  <h1 class="page-title">{{t "Admin Keys"}}</h1>
</div>

<div class="key-search-bar">
  <label class="visually-hidden" for="keySearch">{{t "Search by name, email, or key prefix..."}}</label>
  <input type="text" id="keySearch" class="form-input form-input-sm du-input du-input-bordered" placeholder="{{t "Search by name, email, or key prefix..."}}" style="width:220px" oninput="keySearchDebounced()">
  <label class="visually-hidden" for="statusFilter">{{t "All Statuses"}}</label>
  <select id="statusFilter" class="form-select form-select-sm du-select du-select-bordered" style="width:110px" onchange="filterKeys()">
    <option value="">{{t "All Statuses"}}</option>
    <option value="active">{{t "Active"}}</option>
    <option value="disabled">{{t "Disabled"}}</option>
    <option value="revoked">{{t "Revoked"}}</option>
  </select>
  <label class="visually-hidden" for="typeFilter">{{t "All Types"}}</label>
  <select id="typeFilter" class="form-select form-select-sm du-select du-select-bordered" style="width:120px" onchange="filterKeys()">
    <option value="">{{t "All Types"}}</option>
    <option value="general">{{t "General"}}</option>
    <option value="subscription">{{t "Subscription"}}</option>
    <option value="enterprise">{{t "Enterprise"}}</option>
  </select>
  <div style="flex:1"></div>
  <button class="btn btn-secondary btn-sm" onclick="refreshKeys()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>{{t "Refresh"}}</button>
</div>

<div class="card">
  <div class="data-table-wrapper">
    <table class="data-table du-table du-table-zebra" id="keysTable">
      <thead>
        <tr>
          <th>{{t "Name"}}</th>
          <th>{{t "Key Prefix"}}</th>
          <th>{{t "User"}}</th>
          <th>{{t "Type"}}</th>
          <th>{{t "Status"}}</th>
          <th>{{t "RPM"}}</th>
          <th>{{t "Created"}}</th>
          <th>{{t "Actions"}}</th>
        </tr>
      </thead>
      <tbody id="keysBody">
        <tr><td colspan="8" class="text-center text-muted">{{t "Loading..."}}</td></tr>
      </tbody>
    </table>
  </div>
</div>

<div class="pagination" id="keys-pagination" style="display:none">
  <button class="btn btn-sm btn-secondary" data-page="prev"></button>
  <span class="pagination-info"></span>
  <button class="btn btn-sm btn-secondary" data-page="next"></button>
</div>

<script>
let allKeys = [];
let currentPage = 1;
let totalKeys = 0;
const pageSize = 50;
var keySearchDebounced = debounceInput(filterKeys, 300);

async function refreshKeys() {
  const tbody = document.getElementById('keysBody');
  tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted">{{t "Loading..."}}</td></tr>';
  try {
    const resp = await fetch('/api/admin/downstream-keys?page=' + currentPage + '&page_size=' + pageSize);
    const data = await resp.json();
    allKeys = data.keys || [];
    totalKeys = data.total || 0;
    renderPagination({
      wrapId: 'keys-pagination',
      page: currentPage,
      totalPages: Math.ceil(totalKeys / pageSize),
      total: totalKeys,
      onPage: function(p) { currentPage = p; refreshKeys(); }
    });
    filterKeys();
  } catch(e) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-error">{{t "Failed to load keys"}}</td></tr>';
  }
}

function filterKeys() {
  const search = document.getElementById('keySearch').value.toLowerCase();
  const status = document.getElementById('statusFilter').value;
  const type = document.getElementById('typeFilter').value;

  const filtered = allKeys.filter(k => {
    if (status && k.status !== status) return false;
    if (type) {
      const kt = (k.key_type || 'general').toLowerCase();
      if (kt !== type) return false;
    }
    if (search) {
      const name = (k.name || '').toLowerCase();
      const email = (k.user_email || '').toLowerCase();
      const prefix = (k.key_prefix || '').toLowerCase();
      if (!name.includes(search) && !email.includes(search) && !prefix.includes(search)) return false;
    }
    return true;
  });

  renderKeys(filtered);
}

function renderKeys(keys) {
  const tbody = document.getElementById('keysBody');
  if (keys.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted">{{t "No keys found"}}</td></tr>';
    return;
  }
  tbody.innerHTML = keys.map(k => {
    const isActive = k.status === 'active';
    const statusLabel = isActive ? '{{t "Active"}}' : (k.status === 'disabled' ? '{{t "Disabled"}}' : '{{t "Revoked"}}');
    const statusClass = k.status === 'active' ? 'badge badge-success' : (k.status === 'disabled' ? 'badge badge-warning' : 'badge badge-danger');
    return `<tr>
      <td><div class="font-medium">${escHtml(k.name || '')}</div></td>
      <td><code class="text-sm">${escHtml(k.key_prefix || '')}</code></td>
      <td><div class="font-medium text-sm">${escHtml(k.user_name || '')}</div><div class="text-xs text-muted font-mono">${escHtml(k.user_email || '')}</div></td>
      <td><span class="text-sm">${escHtml(k.key_type || 'general')}</span></td>
      <td><span class="${statusClass}">${statusLabel}</span></td>
      <td><span class="text-sm">${k.rate_limit_rpm != null ? k.rate_limit_rpm : '-'}</span></td>
      <td><span class="text-sm text-muted">${k.created_at ? new Date(k.created_at).toLocaleDateString() : '-'}</span></td>
      <td>
        ${isActive
          ? `<button class="btn btn-sm btn-warning" onclick="toggleKeyStatus('${k.id}','${escHtml(k.name||'')}','disabled')">{{t "Disable"}}</button>`
          : `<button class="btn btn-sm btn-success" onclick="toggleKeyStatus('${k.id}','${escHtml(k.name||'')}','active')">{{t "Enable"}}</button>`}
        <button class="btn btn-sm btn-danger" onclick="deleteKey('${k.id}','${escHtml(k.name||'')}')">{{t "Delete"}}</button>
      </td>
    </tr>`;
  }).join('');
}

async function toggleKeyStatus(keyId, keyName, newStatus) {
  const action = newStatus === 'active' ? '{{t "Enable"}}' : '{{t "Disable"}}';
  if (typeof showConfirm === 'function') {
    showConfirm(action + ' Key', '{{t "Are you sure you want to"}} ' + action.toLowerCase() + ' ' + (keyName || keyId) + '?', async function() {
      await doToggle(keyId, newStatus);
    });
  } else {
    if (!confirm(action + ' ' + (keyName || keyId) + '?')) return;
    await doToggle(keyId, newStatus);
  }
}

async function doToggle(keyId, newStatus) {
  try {
    const resp = await fetch('/api/admin/downstream-keys/' + keyId + '/status', {
      method: 'PATCH',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({status: newStatus}),
    });
    const data = await resp.json();
    if (data.success) {
      refreshKeys();
    } else {
      alert(data.error?.message || '{{t "Failed to update status"}}');
    }
  } catch(e) {
    alert('{{t "Failed to update status"}}');
  }
}

async function deleteKey(keyId, keyName) {
  const title = '{{t "Delete Key"}}';
  const msg = '{{t "Deleting a key is permanent and cannot be undone. Use this to clean up keys whose owner was removed."}}' +
    ' (' + (keyName || keyId) + ')';
  if (typeof showConfirm === 'function') {
    showConfirm(title, msg, async function() { await doDelete(keyId); });
  } else {
    if (!confirm(title + '\n' + msg)) return;
    await doDelete(keyId);
  }
}

async function doDelete(keyId) {
  try {
    const resp = await fetch('/api/admin/downstream-keys/' + keyId, {method: 'DELETE'});
    const data = await resp.json();
    if (data.success) {
      refreshKeys();
    } else {
      alert(data.error?.message || '{{t "Failed to delete key"}}');
    }
  } catch(e) {
    alert('{{t "Failed to delete key"}}');
  }
}

function escHtml(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

refreshKeys();
</script>
{{end}}
