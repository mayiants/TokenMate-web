{{define "content"}}
<div class="page-header">
  <h1 class="page-title">{{t "Announcements"}}</h1>
</div>

<!-- Announcement Stats -->
<div class="stats-bar">
  <div class="stat-item">
    <div class="stat-icon stat-icon-primary">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
    </div>
    <div class="stat-content">
      <div class="stat-value" id="stat-total-announcements">-</div>
      <div class="stat-label">{{t "Announcement"}}</div>
    </div>
  </div>
</div>

<div class="card">
  <div class="card-header" style="display:flex;justify-content:space-between;align-items:center">
    <h2 class="card-title">{{t "Announcement"}}</h2>
    <button class="btn btn-primary" onclick="openAnnouncementDrawer()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>{{t "New"}}</button>
  </div>
  <div class="data-table-wrapper mt-4">
    <table class="data-table du-table du-table-zebra">
      <thead>
        <tr>
          <th>ID</th>
          <th>{{t "Title"}}</th>
          <th>{{t "Type"}}</th>
          <th>{{t "Display Mode"}}</th>
          <th>{{t "Status"}}</th>
          <th>{{t "Pinned"}}</th>
          <th>{{t "Read"}}</th>
          <th>{{t "Created At"}}</th>
          <th>{{t "Actions"}}</th>
        </tr>
      </thead>
      <tbody id="announcements-list"></tbody>
    </table>
  </div>
</div>

<!-- Create/Edit Announcement Drawer -->
<div id="announcement-backdrop" class="drawer-backdrop" onclick="closeAnnouncementDrawer()"></div>
<div id="announcement-drawer" class="drawer">
  <div class="drawer-header">
    <span class="drawer-title" id="drawer-title">{{t "New Announcement"}}</span>
    <button class="drawer-close" onclick="closeAnnouncementDrawer()">&times;</button>
  </div>
  <div class="drawer-body">
    <input type="hidden" id="edit-id">
    <div class="form-group">
      <label class="form-label" for="ann-title">{{t "Title"}}</label>
      <input type="text" id="ann-title" class="form-input du-input du-input-bordered" placeholder="{{t "Announcement Title"}}">
    </div>
    <div class="form-group">
      <label class="form-label" for="ann-content">{{t "Content"}}</label>
      <textarea id="ann-content" class="form-input du-input du-input-bordered" rows="6" placeholder="{{t "Announcement Content"}}" style="resize:vertical"></textarea>
    </div>
    <div class="flex gap-4">
      <div class="form-group" style="flex:1">
        <label class="form-label" for="ann-type">{{t "Type"}}</label>
        <select id="ann-type" class="form-select du-select du-select-bordered" onchange="onTypeChange()">
          <option value="info">{{t "Information"}}</option>
          <option value="warning">{{t "Warning"}}</option>
          <option value="maintenance">{{t "Maintenance"}}</option>
          <option value="update">{{t "Update"}}</option>
          <option value="promo">{{t "Promotion"}}</option>
          <option value="onboarding">{{t "Onboarding"}}</option>
        </select>
      </div>
      <div class="form-group" style="flex:1">
        <label class="form-label" for="ann-display-mode">{{t "Display Mode"}}</label>
        <select id="ann-display-mode" class="form-select du-select du-select-bordered" onchange="onDisplayModeChange()">
          <option value="modal">{{t "Modal"}}</option>
          <option value="banner">{{t "Top Banner"}}</option>
          <option value="wizard">{{t "Onboarding Wizard"}}</option>
        </select>
      </div>
    </div>
    <div class="flex gap-4">
      <div class="form-group" style="flex:1">
        <label class="form-label" for="ann-priority">{{t "Priority"}}</label>
        <input type="number" id="ann-priority" class="form-input du-input du-input-bordered" value="0">
      </div>
      <div class="form-group" style="flex:1">
        <label class="form-label" for="ann-target-audience">{{t "Target Audience"}}</label>
        <select id="ann-target-audience" class="form-select du-select du-select-bordered">
          <option value="all">{{t "All Users"}}</option>
          <option value="new_user">{{t "New Users (7 days)"}}</option>
          <option value="enterprise">{{t "Enterprise Users"}}</option>
          <option value="free">{{t "Free Users"}}</option>
        </select>
      </div>
    </div>

    <!-- CTA fields (shown for banner/wizard) -->
    <div id="cta-fields" style="display:none">
      <div class="flex gap-4">
        <div class="form-group" style="flex:1">
          <label class="form-label" for="ann-cta-text">{{t "CTA Text"}}</label>
          <input type="text" id="ann-cta-text" class="form-input du-input du-input-bordered" placeholder='{{t "Claim Now / Start Setup"}}'>
        </div>
        <div class="form-group" style="flex:1">
          <label class="form-label" for="ann-cta-link">{{t "CTA Link"}}</label>
          <input type="text" id="ann-cta-link" class="form-input du-input du-input-bordered" placeholder="/billing/topup?plan=xxx">
        </div>
      </div>
    </div>

    <!-- Banner-specific fields -->
    <div id="banner-fields" style="display:none">
      <div class="flex gap-4">
        <div class="form-group" style="flex:1">
          <label class="form-label" for="ann-banner-color">{{t "Banner Style"}}</label>
          <select id="ann-banner-color" class="form-select du-select du-select-bordered">
            <option value="gradient-brand">{{t "Brand Gradient"}}</option>
            <option value="gradient-blue">{{t "Blue Gradient"}}</option>
            <option value="gradient-purple">{{t "Purple Gradient"}}</option>
            <option value="gradient-amber">{{t "Amber Gradient"}}</option>
            <option value="gradient-rose">{{t "Rose Gradient"}}</option>
            <option value="gradient-teal">{{t "Teal Gradient"}}</option>
            <option value="primary">{{t "Primary (Blue)"}}</option>
            <option value="success">{{t "Success (Green)"}}</option>
            <option value="warning">{{t "Warning (Yellow)"}}</option>
            <option value="danger">{{t "Danger (Red)"}}</option>
          </select>
        </div>
        <div class="form-group" style="flex:1">
          <label class="form-label" for="ann-dismiss-mode">{{t "Dismiss Mode"}}</label>
          <select id="ann-dismiss-mode" class="form-select du-select du-select-bordered">
            <option value="session">{{t "Session only"}}</option>
            <option value="permanent">{{t "Dismiss Permanently"}}</option>
            <option value="always">{{t "Always show"}}</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Emoji + date row -->
    <div class="flex gap-4">
      <div class="form-group" style="flex:1">
        <label class="form-label" for="ann-icon-emoji">{{t "Icon Emoji"}}</label>
        <input type="text" id="ann-icon-emoji" class="form-input du-input du-input-bordered" placeholder="🎁 / 🎉 / 🚀" maxlength="10">
      </div>
      <div class="form-group" style="flex:1">
        <label class="form-label" for="ann-range">{{t "Date Range"}}</label>
        <input type="hidden" id="ann-start">
        <input type="hidden" id="ann-end">
        <input type="text" id="ann-range" class="form-input fp-range du-input du-input-bordered" style="width: 260px" data-from="ann-start" data-to="ann-end" placeholder="{{t "Start Date ~ End Date"}}" readonly>
      </div>
    </div>

    <div class="flex items-center gap-4 mt-4">
      <label class="flex items-center gap-2" for="ann-pinned">
        <input type="checkbox" id="ann-pinned">{{t "Pinned"}}</label>
      <label class="flex items-center gap-2" for="ann-popup">
        <input type="checkbox" id="ann-popup">{{t "Popup Display"}}</label>
    </div>
  </div>
  <div class="drawer-footer">
    <button class="btn btn-secondary" onclick="closeAnnouncementDrawer()">{{t "Cancel"}}</button>
    <button class="btn btn-primary" onclick="saveAnnouncement()">{{t "Save"}}</button>
  </div>
</div>

<script>
// ── Drawer helpers ──
function showAnnouncementDrawer(){
  var d=document.getElementById('announcement-drawer'),b=document.getElementById('announcement-backdrop');
  if(d)d.classList.add('open');if(b)b.classList.add('open');
}
function closeAnnouncementDrawer(){
  var d=document.getElementById('announcement-drawer'),b=document.getElementById('announcement-backdrop');
  if(d)d.classList.remove('open');if(b)b.classList.remove('open');
}
// Timestamp formatter
function fmtTs(ts) {
  if (!ts) return '-';
  var d = new Date(ts);
  if (!isNaN(d.getTime())) return formatDateTime(ts);
  var s = String(ts).replace(/\D/g,'');
  if (s.length >= 14) {
    return s.substring(0,4)+'-'+s.substring(4,6)+'-'+s.substring(6,8)+' '+s.substring(8,10)+':'+s.substring(10,12)+':'+s.substring(12,14);
  }
  return ts;
}
// ── API helper ──
function api(url, opts) {
  opts = opts || {};
  opts.credentials = 'same-origin';
  opts.headers = opts.headers || {};
  opts.headers['Content-Type'] = 'application/json';
  return fetch(url, opts).then(function(r){return r.json()});
}

// ── Conditional field display ──
function onTypeChange() {
  var type = document.getElementById('ann-type').value;
  var mode = document.getElementById('ann-display-mode');
  // Auto-set display_mode default based on type
  if (type === 'promo' && mode.value === 'modal') {
    mode.value = 'banner';
  } else if (type === 'onboarding' && mode.value === 'modal') {
    mode.value = 'wizard';
  }
  onDisplayModeChange();
}

function onDisplayModeChange() {
  var mode = document.getElementById('ann-display-mode').value;
  var ctaFields = document.getElementById('cta-fields');
  var bannerFields = document.getElementById('banner-fields');
  // Show CTA fields for banner and wizard
  ctaFields.style.display = (mode === 'banner' || mode === 'wizard') ? '' : 'none';
  // Show banner-specific fields only for banner
  bannerFields.style.display = (mode === 'banner') ? '' : 'none';
}

function openAnnouncementDrawer() {
  document.getElementById('drawer-title').textContent = _t('New Announcement');
  document.getElementById('edit-id').value = '';
  document.getElementById('ann-title').value = '';
  document.getElementById('ann-content').value = '';
  document.getElementById('ann-type').value = 'info';
  document.getElementById('ann-display-mode').value = 'modal';
  document.getElementById('ann-priority').value = '0';
  document.getElementById('ann-target-audience').value = 'all';
  document.getElementById('ann-cta-text').value = '';
  document.getElementById('ann-cta-link').value = '';
  document.getElementById('ann-banner-color').value = 'gradient-brand';
  document.getElementById('ann-dismiss-mode').value = 'session';
  document.getElementById('ann-icon-emoji').value = '';
  document.getElementById('ann-start').value = '';
  document.getElementById('ann-end').value = '';
  var rangeEl = document.getElementById('ann-range');
  if (rangeEl && rangeEl._fpInstance) rangeEl._fpInstance.clear();
  document.getElementById('ann-pinned').checked = false;
  document.getElementById('ann-popup').checked = false;
  onDisplayModeChange();
  showAnnouncementDrawer();
}

function loadAnnouncements() {
  api('/api/admin/announcements').then(function(data) {
    var list = document.getElementById('announcements-list');
    list.innerHTML = '';
    var announcements = data.announcements || [];

    var statEl = document.getElementById('stat-total-announcements');
    if (statEl) statEl.textContent = announcements.length;

    if (announcements.length === 0) {
      list.innerHTML = '<tr><td colspan="9" class="text-center text-muted py-8">' + _t('No data') + '</td></tr>';
      return;
    }

    announcements.forEach(function(a) {
      var typeLabel = {info:_t('Info'),warning:_t('Warning'),maintenance:_t('Maintenance'),update:_t('Update'),promo:_t('Promotion')||'Promo',onboarding:_t('Guide')||'Onboarding'}[a.type]||a.type;
      var modeLabel = {modal:_t('Popup')||'Modal',banner:_t('Top Banner')||'Banner',wizard:_t('Onboarding Guide')||'Wizard'}[a.display_mode]||a.display_mode||'Modal';
      var statusBadge = a.status==='published'?'<span class="badge badge-success">' + _t('Published') + '</span>':
                        a.status==='archived'?'<span class="badge badge-info">' + _t('Archived') + '</span>':
                        '<span class="badge badge-warning">' + _t('Draft') + '</span>';
      var actions = '';
      if (a.status === 'draft') {
        actions += '<button class="btn btn-sm btn-primary" onclick="publishAnnouncement(\''+a.id+'\')">' + _t('Publish') + '</button> ';
      }
      if (a.status === 'published') {
        actions += '<button class="btn btn-sm btn-secondary" onclick="archiveAnnouncement(\''+a.id+'\')">' + _t('Archive') + '</button> ';
      }
      actions += '<button class="btn btn-sm btn-secondary" onclick="editAnnouncement(\''+a.id+'\')">' + _t('Edit') + '</button> ';
      actions += '<button class="btn btn-sm btn-danger" onclick="deleteAnnouncement(\''+a.id+'\')">' + _t('Delete') + '</button>';
      list.innerHTML += '<tr><td>'+a.id+'</td><td>'+a.title+'</td><td>'+typeLabel+'</td><td>'+modeLabel+'</td><td>'+statusBadge+'</td><td>'+((a.pinned)?_t('Yes'):_t('No'))+'</td><td>'+(a.read_count||0)+'</td><td>'+fmtTs(a.created_at)+'</td><td>'+actions+'</td></tr>';
    });
  });
}

function editAnnouncement(id) {
  api('/api/admin/announcements/'+id).then(function(a) {
    document.getElementById('drawer-title').textContent = _t('Edit Announcement');
    document.getElementById('edit-id').value = a.id;
    document.getElementById('ann-title').value = a.title;
    document.getElementById('ann-content').value = a.content;
    document.getElementById('ann-type').value = a.type || 'info';
    document.getElementById('ann-display-mode').value = a.display_mode || 'modal';
    document.getElementById('ann-priority').value = a.priority;
    document.getElementById('ann-target-audience').value = a.target_audience || 'all';
    document.getElementById('ann-cta-text').value = a.cta_text || '';
    document.getElementById('ann-cta-link').value = a.cta_link || '';
    document.getElementById('ann-banner-color').value = a.banner_color || 'gradient-brand';
    document.getElementById('ann-dismiss-mode').value = a.dismiss_mode || 'session';
    document.getElementById('ann-icon-emoji').value = a.icon_emoji || '';
    document.getElementById('ann-pinned').checked = a.pinned;
    document.getElementById('ann-popup').checked = a.show_popup;
    if (a.start_at) document.getElementById('ann-start').value = a.start_at.substring(0,10);
    if (a.end_at) document.getElementById('ann-end').value = a.end_at.substring(0,10);
    var rangeEl = document.getElementById('ann-range');
    if (rangeEl && rangeEl._fpInstance) {
      var dates = [];
      if (document.getElementById('ann-start').value) dates.push(document.getElementById('ann-start').value);
      if (document.getElementById('ann-end').value) dates.push(document.getElementById('ann-end').value);
      rangeEl._fpInstance.setDate(dates, false);
    }
    onDisplayModeChange();
    showAnnouncementDrawer();
  });
}

function saveAnnouncement() {
  var id = document.getElementById('edit-id').value;
  var body = {
    title: document.getElementById('ann-title').value,
    content: document.getElementById('ann-content').value,
    type: document.getElementById('ann-type').value,
    display_mode: document.getElementById('ann-display-mode').value,
    priority: parseInt(document.getElementById('ann-priority').value),
    target_audience: document.getElementById('ann-target-audience').value,
    pinned: document.getElementById('ann-pinned').checked,
    show_popup: document.getElementById('ann-popup').checked,
  };

  // CTA fields
  var ctaText = document.getElementById('ann-cta-text').value;
  var ctaLink = document.getElementById('ann-cta-link').value;
  if (ctaText) body.cta_text = ctaText;
  if (ctaLink) body.cta_link = ctaLink;

  // Banner-specific fields
  var mode = document.getElementById('ann-display-mode').value;
  if (mode === 'banner') {
    body.banner_color = document.getElementById('ann-banner-color').value;
    body.dismiss_mode = document.getElementById('ann-dismiss-mode').value;
  } else if (mode === 'wizard') {
    body.dismiss_mode = 'permanent';
  }

  // Emoji
  var emoji = document.getElementById('ann-icon-emoji').value;
  if (emoji) body.icon_emoji = emoji;

  // Date range
  var start = document.getElementById('ann-start').value;
  var end = document.getElementById('ann-end').value;
  if (start) body.start_at = start;
  if (end) body.end_at = end;

  var url = id ? '/api/admin/announcements/'+id : '/api/admin/announcements';
  var method = id ? 'PUT' : 'POST';
  api(url, {method: method, body: JSON.stringify(body)}).then(function(data) {
    if (data.success || data.id) {
      closeAnnouncementDrawer();
      loadAnnouncements();
    } else {
      showMessage(_t('Error'), (data.error && data.error.message) ? data.error.message : _t('Save failed'));
    }
  });
}

function publishAnnouncement(id) {
  api('/api/admin/announcements/'+id+'/publish', {method:'POST'}).then(function(){window.location.reload();});
}

function archiveAnnouncement(id) {
  api('/api/admin/announcements/'+id+'/archive', {method:'POST'}).then(function(){window.location.reload();});
}

var executeConfirm = executeGlobalConfirm;

function deleteAnnouncement(id) {
  showConfirm(_t('Delete'), _t('Delete this announcement?'), function() {
    fetch('/api/admin/announcements/'+id, {
      method:'DELETE', credentials:'same-origin'
    }).then(function(r){return r.json()}).then(function(){window.location.reload();});
  });
}

loadAnnouncements();
</script>
{{end}}
