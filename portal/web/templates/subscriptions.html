{{define "content"}}
{{$d := .Data}}
<h1 class="page-title">{{t "Subscription Center"}}</h1>
<p class="text-muted mt-2">{{t "Choose the package that suits you and get better prices and more quotas"}}</p>

<!-- Plan Cards -->
<div class="plans-grid mt-4" x-data="plansPage()" x-init="init()">
  <template x-if="loading">
    <div class="text-center py-12 text-muted">{{t "Loading..."}}</div>
  </template>

  <template x-if="!loading && plans.length === 0">
    <div class="empty-state">
      <svg class="empty-state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" focusable="false"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
      <p class="empty-state-title">{{t "No data"}}</p>
    </div>
  </template>

  <template x-for="plan in plans" :key="plan.id">
    <div class="plan-card" :class="{'plan-popular': plan.popular}">
      <div class="plan-header">
        <h3 class="plan-name" x-text="plan.name"></h3>
        <template x-if="plan.popular">
          <span class="plan-badge">{{t "Recommended"}}</span>
        </template>
      </div>

      <div class="plan-price">
        <span class="plan-price-amount" x-text="Currency.formatShort(plan.price)"></span>
        <span class="plan-price-unit" x-text="Currency.unit()"></span>
      </div>

      <div class="plan-duration" x-text="plan.duration_display"></div>

      <ul class="plan-features">
        <li>
          <svg class="plan-check" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" focusable="false"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>
          <span x-text="formatQuota(plan.quota, plan.plan_type)"></span>
        </li>
        <template x-if="plan.daily_limit > 0">
          <li>
            <svg class="plan-check" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" focusable="false"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>
            <span x-text="_t('Daily Limit ') + formatQuota(plan.daily_limit, plan.plan_type)"></span>
          </li>
        </template>
        <li>
          <svg class="plan-check" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" focusable="false"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>
          <span x-text="plan.plan_type === 'token' ? _t('Token Billing') : _t('Pay-per-use Billing')"></span>
        </li>
        <template x-if="plan.model_permissions && plan.model_permissions.length > 0">
          <li>
            <svg class="plan-check" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" focusable="false"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>
            <span :title="plan.model_permissions.join(', ')" x-text="_t('Available models: ') + plan.model_permissions.slice(0,3).join(', ') + (plan.model_permissions.length > 3 ? ' +' + (plan.model_permissions.length - 3) : '')"></span>
          </li>
        </template>
        <li class="plan-desc" x-show="plan.tpm_limit > 0 || plan.concurrent_limit > 0">
          <svg class="plan-check" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" focusable="false"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>
          <span x-text="planDesc(plan)"></span>
        </li>
      </ul>

      <button class="btn plan-btn" :class="plan.popular ? 'btn-primary' : 'btn-secondary'" @click="purchasePlan(plan)">{{t "Buy it now"}}</button>
    </div>
  </template>
</div>

<!-- Purchase Modal -->
<div id="purchase-modal" class="modal-overlay" style="display:none" x-data="purchaseModal()">
  <div class="modal" style="max-width: 450px">
    <div class="modal-header">
      <span class="modal-title">{{t "Buy a package"}}</span>
      <button class="modal-close" onclick="document.getElementById('purchase-modal').style.display='none'">&times;</button>
    </div>
    <div class="modal-body">
      <div class="purchase-summary">
        <div class="purchase-row">
          <span>{{t "Plan Name"}}</span>
          <strong id="purchase-plan-name"></strong>
        </div>
        <div class="purchase-row">
          <span>{{t "Validity period"}}</span>
          <span id="purchase-plan-duration"></span>
        </div>
        <div class="purchase-row">
          <span>{{t "Quota"}}</span>
          <span id="purchase-plan-quota"></span>
        </div>
        <div class="purchase-row purchase-total">
          <span>{{t "Payment amount"}}</span>
          <strong class="text-primary" id="purchase-plan-price"></strong>
        </div>
      </div>

      <div class="form-group mt-4">
        <label class="form-label">{{t "Select payment method"}}</label>
        <div class="payment-methods">
          <label class="payment-method" :class="{'active': method === 'alipay'}">
            <input type="radio" name="payment_method" value="alipay" x-model="method" aria-label="Payment Method">
            <span>{{t "Alipay"}}</span>
          </label>
          <label class="payment-method" :class="{'active': method === 'wechat'}">
            <input type="radio" name="payment_method" value="wechat" x-model="method" aria-label="Payment Method">
            <span>{{t "WeChat Pay"}}</span>
          </label>
          <label class="payment-method" :class="{'active': method === 'stripe'}">
            <input type="radio" name="payment_method" value="stripe" x-model="method" aria-label="Payment Method">
            <span>Stripe</span>
          </label>
          <label class="payment-method" :class="{'active': method === 'paypal'}">
            <input type="radio" name="payment_method" value="paypal" x-model="method" aria-label="Payment Method">
            <span>PayPal</span>
          </label>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="document.getElementById('purchase-modal').style.display='none'">{{t "Cancel"}}</button>
      <button class="btn btn-primary" @click="confirmPurchase()" :disabled="processing" x-text="processing ? _t('Processing...') : _t('Pay')"></button>
    </div>
  </div>
</div>

<style>

.plans-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 24px;
}

.plan-card {
  background: var(--bg-card);
  border: 2px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 24px;
  display: flex;
  flex-direction: column;
  transition: all 0.2s ease;
}

.plan-card:hover {
  border-color: var(--primary);
  transform: translateY(-2px);
}

.plan-popular {
  border-color: var(--primary);
  position: relative;
}

.plan-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}

.plan-name {
  font-size: 1.25rem;
  font-weight: 600;
  margin: 0;
}

.plan-badge {
  background: var(--primary);
  color: white;
  font-size: 0.75rem;
  padding: 4px 8px;
  border-radius: var(--radius);
}

.plan-price {
  margin-bottom: 8px;
}

.plan-price-amount {
  font-size: 2.5rem;
  font-weight: 700;
  color: var(--primary);
}

.plan-price-unit {
  font-size: 1rem;
  color: var(--text-muted);
}

.plan-duration {
  color: var(--text-muted);
  font-size: 0.875rem;
  margin-bottom: 20px;
}

.plan-features {
  list-style: none;
  padding: 0;
  margin: 0 0 24px 0;
  flex: 1;
}

.plan-features li {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 0;
  font-size: 0.875rem;
}

.plan-check {
  width: 16px;
  height: 16px;
  color: var(--success-text);
  flex-shrink: 0;
}

.plan-desc {
  color: var(--text-muted);
  font-style: italic;
}

.plan-btn {
  width: 100%;
}

.purchase-summary {
  background: var(--bg-hover);
  border-radius: var(--radius);
  padding: 16px;
}

.purchase-row {
  display: flex;
  justify-content: space-between;
  padding: 8px 0;
  font-size: 0.875rem;
}

.purchase-total {
  border-top: 1px solid var(--border);
  margin-top: 8px;
  padding-top: 16px;
  font-size: 1rem;
}

.payment-methods {
  display: flex;
  gap: 12px;
}

.payment-method {
  flex: 1;
  padding: 12px;
  border: 2px solid var(--border);
  border-radius: var(--radius);
  text-align: center;
  cursor: pointer;
  transition: all 0.2s ease;
}

.payment-method:hover {
  border-color: var(--primary);
}

.payment-method.active {
  border-color: var(--primary);
  background: var(--primary-light);
}

.payment-method input {
  display: none;
}
</style>

<script>
function plansPage() {
  return {
    plans: [],
    loading: false,
    async init() {
      this.loading = true;
      try {
        const resp = await fetch('/api/subscriptions/plans');
        const json = await resp.json();
        this.plans = json.plans || [];
        // Mark middle plan as popular
        if (this.plans.length >= 2) {
          this.plans[Math.floor(this.plans.length / 2)].popular = true;
        }
      } catch (e) {
        this.plans = [];
      }
      this.loading = false;
    },
    formatPrice(quota) {
      return Currency.formatValue(quota);
    },
    currencySymbol() {
      return Currency.symbol();
    },
    currencyUnit() {
      return Currency.unit();
    },
    t(text) { return (window._t || function(t){return t;})(text); },
    planDesc(plan) {
      var parts = [];
      if (plan.quota) {
        parts.push(this.formatQuota(plan.quota, plan.plan_type) + '/month');
      }
      if (plan.tpm_limit > 0) {
        parts.push(this.formatTpm(plan.tpm_limit));
      }
      if (plan.concurrent_limit > 0) {
        parts.push(plan.concurrent_limit + ' Concurrent');
      }
      return parts.join(', ');
    },
    formatTpm(tpm) {
      if (tpm >= 1000000) return (tpm / 1000000).toFixed(0) + 'M TPM';
      if (tpm >= 1000) return (tpm / 1000).toFixed(0) + 'K TPM';
      return tpm + ' TPM';
    },
    formatQuota(quota, type) {
      if (!quota) return _t('Unlimited');
      if (type === 'token') {
        if (quota >= 1000000) return (quota / 1000000).toFixed(1) + 'M Tokens';
        if (quota >= 1000) return (quota / 1000).toFixed(0) + 'K Tokens';
        return quota + ' Tokens';
      }
      return quota + _t(' times');
    },
    purchasePlan(plan) {
      window.currentPlan = plan;
      document.getElementById('purchase-plan-name').textContent = plan.name || '';
      document.getElementById('purchase-plan-duration').textContent = plan.duration_display || '';
      var quotaText = plan.quota ? (plan.plan_type === 'token' ? (plan.quota >= 1000000 ? (plan.quota / 1000000).toFixed(1) + 'M Tokens' : plan.quota >= 1000 ? (plan.quota / 1000).toFixed(0) + 'K Tokens' : plan.quota + ' Tokens') : plan.quota + _t(' times')) : _t('Unlimited');
      document.getElementById('purchase-plan-quota').textContent = quotaText;
      document.getElementById('purchase-plan-price').textContent = Currency.formatShort(plan.price || 0);
      document.getElementById('purchase-modal').style.display = 'flex';
    }
  };
}

function purchaseModal() {
  return {
    get plan() { return window.currentPlan; },
    method: 'alipay',
    processing: false,
    t(text) { return (window._t || function(t){return t;})(text); },
    formatQuota(quota, type) {
      if (!quota) return _t('Unlimited');
      if (type === 'token') {
        if (quota >= 1000000) return (quota / 1000000).toFixed(1) + 'M Tokens';
        if (quota >= 1000) return (quota / 1000).toFixed(0) + 'K Tokens';
        return quota + ' Tokens';
      }
      return quota + _t(' times');
    },
    async confirmPurchase() {
      this.processing = true;
      const plan = window.currentPlan;
      if (!plan) {
        showToast('error', _t('Select a plan'));
        this.processing = false;
        return;
      }
      try {
        // Create purchase order
        const csrfToken = document.querySelector('meta[name="csrf-token"]')?.content || '';
        const purchaseResp = await fetch('/api/subscriptions/purchase', {
          method: 'POST',
          credentials: 'same-origin',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRF-Token': csrfToken
          },
          body: JSON.stringify({plan_id: plan.id, csrf_token: csrfToken})
        });
        const purchaseJson = await purchaseResp.json();

        if (!purchaseJson.success) {
          showMessage(_t('Purchase failed'), purchaseJson.error?.message || _t('Purchase failed'));
          this.processing = false;
          return;
        }

        // Create payment session
        const paymentResp = await fetch('/api/payment/create', {
          method: 'POST',
          credentials: 'same-origin',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRF-Token': csrfToken
          },
          body: JSON.stringify({
            order_id: purchaseJson.order_uuid || purchaseJson.order_id,
            payment_method: this.method,
            csrf_token: csrfToken
          })
        });
        const paymentJson = await paymentResp.json();

        if (paymentJson.simulated) {
          showMessage(_t('Subscribed'), _t('Subscription Succeeded (Simulation Mode)'), function() {
            window.location.href = '/subscriptions';
          });
        } else if (paymentJson.payment_url) {
          window.location.href = paymentJson.payment_url;
        } else if (paymentJson.success) {
          window.location.href = '/subscriptions?toast=success&message=Payment successful';
        } else {
          showMessage(_t('Payment failed'), paymentJson.error?.message || _t('Payment link unavailable, please try again later'));
        }
      } catch (e) {
        showMessage(_t('Request failed'), _t('Request failed: ') + e.message);
      }
      this.processing = false;
    }
  };
}
</script>
{{end}}
