{{define "layout-modals"}}
  <!-- Global Message Modal -->
  <div id="global-message-modal" class="modal-overlay" style="display:none; z-index:9999">
    <div class="modal" style="max-width:400px">
      <div class="modal-header">
        <span class="modal-title" id="global-message-title">{{t "Notice"}}</span>
        <button class="modal-close" onclick="closeGlobalModal('global-message-modal')">&times;</button>
      </div>
      <div class="modal-body">
        <p id="global-message-text"></p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" onclick="closeGlobalModal('global-message-modal')">{{t "OK"}}</button>
      </div>
    </div>
  </div>

  <!-- Global Confirm Modal -->
  <div id="global-confirm-modal" class="modal-overlay" style="display:none; z-index:9999">
    <div class="modal" style="max-width:400px">
      <div class="modal-header">
        <span class="modal-title" id="global-confirm-title">{{t "Confirm"}}</span>
        <button class="modal-close" onclick="closeGlobalModal('global-confirm-modal')">&times;</button>
      </div>
      <div class="modal-body">
        <p id="global-confirm-text" style="white-space: pre-line;"></p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeGlobalModal('global-confirm-modal')">{{t "Cancel"}}</button>
        <button class="btn btn-danger" id="global-confirm-btn" onclick="executeGlobalConfirm()">{{t "Confirm"}}</button>
      </div>
    </div>
  </div>

  <!-- Announcement Popup Modal -->
  <div id="announcement-popup-modal" class="modal-overlay" style="display:none; z-index:9998">
    <div class="modal" style="max-width:520px">
      <div class="modal-header">
        <span class="modal-title" id="ann-popup-title">{{t "Announcement"}}</span>
        <button class="modal-close" onclick="closeAnnouncementPopup()">&times;</button>
      </div>
      <div class="modal-body">
        <div id="ann-popup-content" style="line-height:1.7"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeAnnouncementPopup()">{{t "Got it"}}</button>
      </div>
    </div>
  </div>

  <!-- Onboarding Wizard Modal -->
  <div id="onboarding-wizard-modal" class="modal-overlay onboarding-wizard" style="display:none; z-index:9998">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title" id="wizard-title"></span>
        <button class="modal-close" onclick="closeOnboardingWizard()">&times;</button>
      </div>
      <div class="modal-body" id="wizard-body"></div>
      <div class="modal-footer">
        <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-muted)">
          <input type="checkbox" id="wizard-dont-remind" aria-label="Wizard Dont Remind"> {{t "announcement.dont_remind"}}
        </label>
        <button class="btn btn-secondary" onclick="closeOnboardingWizard()">{{t "Skip"}}</button>
      </div>
    </div>
  </div>
{{end}}
