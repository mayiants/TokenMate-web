{{define "content"}}
<div class="auth-page">
  <div class="auth-card">
    <h1>{{t "Forgot password?"}}</h1>
    <p class="subtitle">{{t "AI API Gateway"}}</p>

    <!-- Step 1: request a verification code -->
    <div id="fp-step1">
      <div class="form-group">
        <label class="form-label" for="fp-email">{{t "Email Address"}}</label>
        <input type="email" id="fp-email" class="form-input" required placeholder="your@email.com">
      </div>
      <button type="button" class="btn btn-primary w-full" id="fp-send-btn" onclick="sendResetCode()">{{t "Send Code"}}</button>
    </div>

    <!-- Step 2: enter the code and a new password -->
    <div id="fp-step2" style="display:none;">
      <div class="form-group">
        <label class="form-label" for="fp-code">{{t "Verification Code"}}</label>
        <input type="text" id="fp-code" class="form-input" required placeholder="123456" maxlength="6">
      </div>
      <div class="form-group">
        <label class="form-label" for="fp-password">{{t "New Password"}}</label>
        <input type="password" id="fp-password" class="form-input" required minlength="8" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label class="form-label" for="fp-confirm">{{t "Confirm New Password"}}</label>
        <input type="password" id="fp-confirm" class="form-input" required minlength="8" autocomplete="new-password">
      </div>
      <p class="text-xs text-muted mb-4">{{t "auth.password_requirements"}}</p>
      <button type="button" class="btn btn-primary w-full" onclick="submitResetPassword()">{{t "Reset Password"}}</button>
    </div>

    <p class="text-center mt-4 text-sm text-muted">
      <a href="/login" class="text-primary">{{t "Sign In"}}</a>
    </p>
  </div>
</div>
<script>
function sendResetCode() {
  var email = document.getElementById('fp-email').value.trim();
  if (!email) { showToast('error', _t('Please enter email')); return; }
  var btn = document.getElementById('fp-send-btn');
  btn.disabled = true;
  fetch('/api/auth/forgot-password', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: email })
  })
  .then(function(r) { return r.json(); })
  .then(function(res) {
    btn.disabled = false;
    if (res.success) {
      showToast('success', _t('msg.verification_code_sent'));
      document.getElementById('fp-step2').style.display = 'block';
    } else {
      showToast('error', res.error ? res.error.message : _t('Request failed'));
    }
  })
  .catch(function() { btn.disabled = false; showToast('error', _t('Request failed')); });
}

function submitResetPassword() {
  var email = document.getElementById('fp-email').value.trim();
  var code = document.getElementById('fp-code').value.trim();
  var password = document.getElementById('fp-password').value;
  var confirmPassword = document.getElementById('fp-confirm').value;
  if (!code || !password) { showToast('error', _t('error.all_fields_required')); return; }
  if (password !== confirmPassword) { showToast('error', _t('Passwords do not match')); return; }

  fetch('/api/auth/reset-password', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: email, code: code, password: password })
  })
  .then(function(r) { return r.json(); })
  .then(function(res) {
    if (res.success) {
      showToast('success', _t('msg.password_reset_success'));
      setTimeout(function() { window.location.href = '/login'; }, 1000);
    } else {
      showToast('error', res.error ? res.error.message : _t('Request failed'));
    }
  })
  .catch(function() { showToast('error', _t('Request failed')); });
}
</script>
{{end}}
