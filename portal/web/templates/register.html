{{define "content"}}
<div class="auth-page">
  <div class="auth-card">
    <h1>{{t "Sign Up"}}</h1>
    <p class="subtitle">{{t "AI API Gateway"}}</p>
    <form action="/register" method="POST">
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
      <div class="flash-container">
        {{if .Toast}}<div class="flash flash-{{.Toast.Type}}">{{.Toast.Message}}</div>{{end}}
      </div>
      <div class="form-group">
        <label class="form-label">{{t "Email Address"}}</label>
        <div class="flex gap-2">
          <input type="email" name="email" id="reg-email" class="form-input" required placeholder="your@email.com">
          <button type="button" class="btn btn-secondary text-nowrap" id="reg-send-btn" onclick="sendRegCode()">
            {{t "Send Code"}}
          </button>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">{{t "Verification Code"}}</label>
        <input type="text" name="code" class="form-input" required placeholder="123456" maxlength="6">
      </div>
      <div class="form-group">
        <label class="form-label">{{t "Password"}}</label>
        <input type="password" name="password" class="form-input" required placeholder="••••••••" minlength="8">
      </div>
      <div class="form-group">
        <label class="form-label">{{t "Confirm Password"}}</label>
        <input type="password" name="confirm_password" class="form-input" required placeholder="••••••••" minlength="8">
      </div>
      <div class="form-group">
        <label class="form-label">{{t "Invitation code (optional)"}}</label>
        <input type="text" name="invitation_code" id="invitation-code" class="form-input" placeholder="INV-XXXXXXXX">
      </div>
      <p class="text-xs text-muted mb-4">{{t "auth.password_requirements"}}</p>
      <button type="submit" class="btn btn-primary w-full">{{t "Sign Up"}}</button>
    </form>
    <p class="text-center mt-4 text-sm text-muted">
      {{t "Already have an account?"}} <a href="/login" class="text-primary">{{t "Sign In"}}</a>
    </p>
  </div>
</div>
<script>
// Pre-fill invitation code from URL parameter (supports ?ref= and ?code=)
(function() {
  var params = new URLSearchParams(window.location.search);
  var code = params.get('ref') || params.get('code');
  if (code) {
    document.getElementById('invitation-code').value = code;
  }
})();

// Send verification code via the JSON API (single implementation: /api/auth/send-code)
function sendRegCode() {
  var email = document.getElementById('reg-email').value.trim();
  if (!email) { showToast('error', _t('error.enter_email')); return; }
  var btn = document.getElementById('reg-send-btn');
  btn.disabled = true;
  fetch('/api/auth/send-code', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: email })
  })
  .then(function(r) { return r.json(); })
  .then(function(res) {
    btn.disabled = false;
    if (res.success) {
      showToast('success', _t('msg.verification_code_sent'));
    } else {
      showToast('error', res.error ? res.error.message : _t('Request failed'));
    }
  })
  .catch(function() { btn.disabled = false; showToast('error', _t('Request failed')); });
}
</script>
{{end}}
