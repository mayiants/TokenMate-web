{{define "content"}}
<div class="auth-page">
  <div class="auth-card">
    <h1>{{t "Sign In"}}</h1>
    <p class="subtitle">{{t "AI API Gateway"}}</p>
    <form action="/login" method="POST">
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
      <div class="flash-container">
        {{if .Toast}}<div class="flash flash-{{.Toast.Type}}">{{.Toast.Message}}</div>{{end}}
      </div>
      <div class="form-group">
        <label class="form-label">{{t "Email Address"}}</label>
        <input type="email" name="email" class="form-input" required placeholder="your@email.com">
      </div>
      <div class="form-group">
        <label class="form-label">{{t "Password"}}</label>
        <input type="password" name="password" class="form-input" required placeholder="••••••••">
      </div>
      <div class="form-group flex items-center justify-between">
        <label class="flex items-center gap-2 text-sm text-muted">
          <input type="checkbox" name="remember_me" aria-label="Remember Me"> {{t "Remember me"}}
        </label>
        <a href="/forgot-password" class="text-sm text-primary">{{t "Forgot password?"}}</a>
      </div>
      <button type="submit" class="btn btn-primary w-full">{{t "Sign In"}}</button>
    </form>
    <!-- Enterprise single sign-on: the e-mail domain decides whether an identity provider exists. -->
    <div class="mt-4" id="sso-login">
      <p class="text-center text-sm text-muted">{{t "or"}}</p>
      <form id="sso-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="sso-email">{{t "Work email for single sign-on"}}</label>
          <input type="email" id="sso-email" class="form-input" autocomplete="email" placeholder="you@company.com" required>
        </div>
        <button type="submit" id="sso-btn" class="btn btn-secondary w-full">{{t "Sign in with SSO"}}</button>
        <div id="sso-msg" class="text-sm text-muted mt-2" role="status" aria-live="polite"></div>
      </form>
    </div>
    <p class="text-center mt-4 text-sm text-muted">
      {{t "Don't have an account?"}} <a href="/register" class="text-primary">{{t "Sign Up"}}</a>
    </p>
  </div>
</div>
<script>
// Home-realm discovery: ask the server whether this e-mail domain has SSO and
// follow the returned start URL. The reply has the same shape for every input.
(function() {
  var form = document.getElementById('sso-form');
  if (!form) return;
  form.addEventListener('submit', function(ev) {
    ev.preventDefault();
    var email = document.getElementById('sso-email').value.trim();
    var msg = document.getElementById('sso-msg');
    var btn = document.getElementById('sso-btn');
    msg.textContent = '';
    if (!email) { msg.textContent = _t('Enter your work email'); return; }
    btn.disabled = true;
    fetch('/api/auth/sso/discover', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email })
    })
    .then(function(r) { return r.json(); })
    .then(function(res) {
      if (res && res.sso && typeof res.start_url === 'string' && res.start_url.indexOf('/auth/sso/start?') === 0) {
        window.location.href = res.start_url;
        return;
      }
      btn.disabled = false;
      msg.textContent = _t('Single sign-on is not set up for this email domain');
    })
    .catch(function() { btn.disabled = false; msg.textContent = _t('Network error'); });
  });
})();
</script>
{{end}}
