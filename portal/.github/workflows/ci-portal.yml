name: Portal CI

on:
  push:
    branches: [main, master, enterprise-cardification]
  pull_request:
    branches: [main, master, enterprise-cardification]

jobs:
  fast-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Portal binary
        run: go build -o portal ./cmd/server

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.14.0

      - name: Schema drift check
        run: bash scripts/check_schema_vs_code.sh

      - name: ON CONFLICT constraint check
        run: python3 scripts/check_on_conflict_constraints.py

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Run govulncheck
        run: govulncheck ./...

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Run unit tests (no DB required)
        run: go test ./internal/middleware/... ./internal/web/... ./pkg/... ./tests/performance/... -v

      - name: i18n full audit
        run: python3 scripts/i18n_full_audit.py --strict

      - name: Verify Tailwind CSS rebuild
        run: bash scripts/rebuild-tailwind.sh

      - name: Lint English product copy with Vale
        run: node scripts/lint-english.js

  regression:
    name: Regression (Postgres + Redis + Console Scan)
    # Pinned to 24.04: the pinned Playwright (1.60.x) has no chromium build
    # for ubuntu-26.04, which ubuntu-latest now resolves to.
    runs-on: ubuntu-24.04
    needs: fast-gate
    env:
      # Hard-coded ephemeral CI values for the isolated test environment.
      # Override via repository secrets if your organization requires it.
      DB_PASSWORD: ci-test-password
      JWT_SECRET: ci-jwt-secret-must-be-at-least-32-characters-long
      ENCRYPTION_KEY: ci-encryption-key-must-be-at-least-32-characters
      PROXY_SYNC_SECRET: ci-proxy-sync-secret-32-characters-long
      ADMIN_SECRET: ci-admin-secret-32-characters-long
      ADMIN_EMAIL: e2e-admin@example.com
      ADMIN_PASSWORD: E2E_AdminPass123!
      ADMIN_NAME: Admin
      ADMIN_MODE: production
      APP_BASE_URL: http://127.0.0.1:3001
      PORTAL_URL: http://127.0.0.1:3001
      E2E_ADMIN_EMAIL: e2e-admin@example.com
      E2E_ADMIN_PASSWORD: E2E_AdminPass123!
      E2E_USER_EMAIL: e2e-user@example.com
      E2E_USER_PASSWORD: E2E_TestPass123!
      E2E_ENTERPRISE_EMAIL: e2e-enterprise@example.com
      E2E_ENTERPRISE_PASSWORD: E2E_TestPass123!
      SEED_E2E_ACCOUNTS: true
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: ai_proxy_portal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: true

      - name: Run DB-dependent tests
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USER: postgres
          DB_NAME: ai_proxy_portal_test
          REDIS_ADDR: 127.0.0.1:6379
        # Run DB-dependent packages sequentially (-p 1). The db package contains a
        # destructive integration test that drops/recreates all tables; running packages
        # concurrently would race with schema initialization in internal/routes and
        # internal/services.
        run: go test -p 1 ./internal/db/... ./internal/routes/... ./internal/services/... -v

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # Key on the workflow file: package.json/lock are gitignored, so the
          # pinned Playwright version below lives here — bumping it must
          # invalidate the browser cache.
          key: playwright-${{ runner.os }}-${{ hashFiles('.github/workflows/ci-portal.yml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright
        # package.json/package-lock.json are gitignored in this repo, so pin
        # the versions here instead of npm ci.
        run: |
          npm install --no-save @playwright/test@1.60.0 playwright@1.60.0 @axe-core/playwright@4.12.1 lighthouse@12.8.2 chrome-launcher@1.2.1
          npx playwright install chromium

      - name: Rebuild static assets
        run: bash scripts/rebuild-tailwind.sh

      - name: Build and start Portal
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USER: postgres
          DB_NAME: ai_proxy_portal_test
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
        run: |
          go build -o portal ./cmd/server
          ./portal &
          # Wait for Portal health endpoint
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3001/api/health >/dev/null 2>&1; then
              echo "Portal is up"
              exit 0
            fi
            sleep 1
          done
          echo "Portal failed to start"
          exit 1

      - name: Quick API integration smoke test
        run: bash tests/test-portal-quick.sh

      - name: Enable E2E test accounts (before UI tests)
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USER: postgres
          DB_NAME: ai_proxy_portal_test
          PGPASSWORD: ci-test-password
        run: bash e2e/e2e-accounts.sh enable

      - name: Playwright UI tests (smoke + all pages)
        run: npx playwright test e2e/ui-smoke.spec.js e2e/ui-all-pages.spec.js --workers=1

      - name: Playwright extended UI tests (admin CRUD, auth flow, mobile layouts)
        # Previously present in e2e/ but never run in CI. All four were verified
        # green locally (64 tests) before being wired in.
        run: >-
          npx playwright test
          e2e/ui-admin-full-crud.spec.js
          e2e/ui-auth-flow.spec.js
          e2e/ui-mobile-all-pages.spec.js
          e2e/ui-mobile-dashboard.spec.js
          --workers=1

      - name: Playwright feature regression (enterprise apply/keys, subscriptions, announcements, role round-trip)
        # Repaired in 2026-11 (locale-independent selectors, current DOM ids,
        # E2E_* credentials instead of hardcoded real accounts) and verified
        # green locally before being wired in. They clean up after themselves.
        run: >-
          npx playwright test
          e2e/ui-enterprise-apply.spec.js
          e2e/ui-crud.spec.js
          e2e/ui-subscriptions.spec.js
          e2e/ui-announcement-extension.spec.js
          e2e/ui-role-roundtrip.spec.js
          e2e/ui-tickets.spec.js
          --workers=1

      - name: Playwright admin field round-trip (create/edit, read back via API)
        # Guards against silent field-drop bugs (form field accepted by the UI
        # but not persisted). 16 active tests (verified in CI); 12 drifted/data-dependent
        # tests are quarantined with test.fixme in the spec (see FIXME markers)
        # and must be re-baselined before being re-enabled.
        run: npx playwright test e2e/ui-admin-field-roundtrip.spec.js --workers=1

      - name: I18n render-time leak scan (EN must not show Chinese, ZH must not leak English)
        # Report-only for now: surfaces render-time i18n leaks in the CI log
        # without blocking, since the full page set may still contain legacy
        # leaks. Promote to a hard gate (remove continue-on-error) once a clean
        # run is confirmed. The JSON-level guard (i18n_full_audit chinese_en) is
        # already blocking in fast-gate.
        continue-on-error: true
        run: npx playwright test e2e/i18n-completeness.spec.js --workers=1

      - name: Scan console and network errors
        run: node e2e/scan-console-errors.js --gate

      - name: Scan accessibility with axe-core
        run: node e2e/scan-a11y-axe.js --gate

      - name: Scan public pages with Lighthouse
        run: node e2e/scan-lighthouse.js --gate

      - name: Disable E2E test accounts (after UI tests)
        if: always()
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USER: postgres
          DB_NAME: ai_proxy_portal_test
          PGPASSWORD: ci-test-password
        run: bash e2e/e2e-accounts.sh disable
