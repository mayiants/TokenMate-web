version: "2"

run:
  timeout: 5m

linters:
  enable:
    - govet
    - staticcheck
    - unused
    - ineffassign
    - errcheck
  exclusions:
    # Test files are allowed to ignore returned errors and contain a few
    # intentionally ineffective assignments; SA1012 (nil context) is common
    # in test helpers that pass context.Background() implicitly.
    rules:
      - path: _test\.go
        linters: [errcheck]
      - path: _test\.go
        text: "SA1012"
        linters: [staticcheck]
      - path: _test\.go
        linters: [ineffassign]

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
