name: Proxy CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  fast-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: true

      - name: Build
        run: go build -o ai-proxy-go ./cmd/server

      - name: go vet
        run: go vet ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Run govulncheck
        run: govulncheck ./...

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.14.0

      - name: Run tests
        run: go test -v -race ./...

      - name: Docker build
        run: docker build -t ai-proxy-go:ci .

  e2e-transform:
    runs-on: ubuntu-latest
    needs: fast-gate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: true

      - name: Run internal transform E2E
        run: bash tests/e2e/e2e-internal-transform.sh
        timeout-minutes: 10
